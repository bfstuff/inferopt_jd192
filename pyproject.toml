[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bfstuff-inferopt_jd192"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bfstuff" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bfstuff.github.io"
Repository = "https://github.com/bfstuff/inferopt_jd192"
Issues = "https://github.com/bfstuff/inferopt_jd192/issues"

[project.scripts]
inferopt_jd192 = "inferopt_jd192:main"

[tool.setuptools]
py-modules = ["inferopt_jd192"]
